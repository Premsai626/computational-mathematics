# ==============================================================================
# ChemicalMix — Render Infrastructure Blueprint (render.yaml)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # OPTION A (RECOMMENDED): Unified Production Web Service
  # ─────────────────────────────────────────────────────────────────────────────
  # Deploys Python Flask + Gunicorn on Render, serving the entire web application:
  #   - Modern SaaS UI pages (HTML5, CSS3, Vanilla JS, Chart.js)
  #   - REST API endpoints (/api/health, /api/calculate, /api/compare)
  #   - NumPy mathematical engine (Jacobi & Gauss-Seidel iterations)
  #
  # Advantages:
  #   - Single public production URL (e.g., https://chemicalmix.onrender.com)
  #   - Zero CORS latency or cross-domain cookie issues
  #   - No spin-down cold-start disconnect between frontend & backend
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: chemicalmix
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ─────────────────────────────────────────────────────────────────────────────
  # OPTION B (DECOUPLED): Frontend Static Site + Backend Web Service
  # ─────────────────────────────────────────────────────────────────────────────
  # If you prefer hosting the frontend as an independent Render Static Site CDN:
  #
  # 1. Backend Web Service:
  #      Name: chemicalmix-backend
  #      Root Directory: .
  #      Build Command: pip install -r requirements.txt
  #      Start Command: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
  #      Health Check Path: /health
  #
  # 2. Frontend Static Site:
  #      Name: chemicalmix-frontend
  #      Root Directory: frontend
  #      Build Command: node inject-env.js
  #      Publish Directory: .
  #      Environment Variables:
  #        - key: BACKEND_URL
  #          value: https://chemicalmix-backend.onrender.com
  # ─────────────────────────────────────────────────────────────────────────────
